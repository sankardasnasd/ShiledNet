{% extends 'user/userhome2.html' %}
{% block body %}

<div style="min-height: 75vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <div style="background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 35px; width: 100%; max-width: 520px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); text-align: center;">

        <!-- Header Section -->
        <div style="margin-bottom: 25px;">
            <div style="display: inline-flex; align-items: center; justify-content: center; width: 55px; height: 55px; background: rgba(6, 182, 212, 0.1); border-radius: 50%; margin-bottom: 12px; border: 1px solid rgba(6, 182, 212, 0.2);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
            <h2 style="color: #f8fafc; font-size: 1.4rem; font-weight: 700; margin: 0 0 6px 0; letter-spacing: 0.5px;">ShieldNet APK Sandbox</h2>
            <p style="color: #94a3b8; font-size: 0.85rem; margin: 0;">Upload an Android package or binary for isolated runtime analysis</p>
        </div>

        <!-- Upload Form -->
        <form method="POST" enctype="multipart/form-data" action="{% url 'upload_and_sandbox_apk' %}" style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
            {% csrf_token %}

            <!-- Custom File Drop Area -->
            <div style="width: 100%; border: 2px dashed #334155; border-radius: 8px; padding: 25px 15px; background: rgba(15, 23, 42, 0.6); box-sizing: border-box; cursor: pointer;">
                <label for="apk_file" style="display: block; cursor: pointer; color: #cbd5e1; font-size: 0.88rem; font-weight: 500; margin-bottom: 10px;">
                    Select APK / Binary File
                </label>
                <input type="file" id="apk_file" name="apk_file" required accept=".apk,.bin,.exe,.dex"
                       style="display: block; width: 100%; max-width: 320px; margin: 0 auto; color: #94a3b8; font-size: 0.85rem; border: 1px solid #334155; border-radius: 6px; padding: 8px; background: #1e293b; box-sizing: border-box; cursor: pointer;">
                <span style="display: block; margin-top: 8px; font-size: 0.75rem; color: #64748b;">Supported: .apk, .bin, .dex, .exe</span>
            </div>

            <!-- Isolation Badge -->
            <div style="display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #10b981; background: rgba(16, 185, 129, 0.1); padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(16, 185, 129, 0.2);">
                <span style="display: inline-block; width: 6px; height: 6px; background: #10b981; border-radius: 50%;"></span>
                Target: Dedicated Isolated Node (Port 5000)
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    style="width: 100%; padding: 12px 20px; background: #06b6d4; color: #020617; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;"
                    onmouseover="this.style.background='#22d3ee'"
                    onmouseout="this.style.background='#06b6d4'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                Dispatch to Isolated Sandbox
            </button>
        </form>

    </div>
</div>

{% endblock %}
